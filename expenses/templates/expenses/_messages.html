{% for message in messages %}
    <div class="alert alert-{{ message.tags }}" role="alert">
        <svg class="icon"><use href="#{% if message.tags == 'success' %}i-check-circle{% else %}i-alert{% endif %}"/></svg>
        <div class="alert-body">{{ message }}</div>
        <button type="button" class="alert-close" aria-label="Close"><svg class="icon icon-sm"><use href="#i-x"/></svg></button>
    </div>
{% endfor %}
