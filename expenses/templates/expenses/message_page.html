{% extends "expenses/base.html" %}
{% block title %}{{ title }} - Expense Tracker{% endblock %}

{% block content %}
<div class="narrow {% if user.is_authenticated %}card card-pad{% endif %}">
    <div class="empty">
        <div class="empty-icon"><svg class="icon"><use href="#i-check-circle"/></svg></div>
        <h3>{{ title }}</h3>
        <p>{{ message }}</p>
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="btn btn-primary" style="margin-top:12px">Go to dashboard</a>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-primary" style="margin-top:12px">Go to login</a>
        {% endif %}
    </div>
</div>
{% endblock %}
